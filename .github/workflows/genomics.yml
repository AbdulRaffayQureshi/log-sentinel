name: 🧬 Genomics Variant Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install jq zsh curl -y
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          API_URL: "https://rest.ensembl.org/lookup/symbol/homo_sapiens/SLC6A4?expand=1"
          API_HEADER: "Content-type:application/json"
        run: |
          mkdir -p logs
          ./bin/fetch_data.sh && source ./bin/parsers/genomics.sh && ./bin/notify_discord.sh
