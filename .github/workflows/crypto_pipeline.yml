name: 🪙 Crypto Platform Sentinel
on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          pip install kaggle
          sudo apt-get update && sudo apt-get install jq zsh -y
      - name: Execute Pipeline
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KAGGLE_DATASET: "adepvenugopal/webserverlogs10k"
          DATA_SOURCE_NAME: "Crypto Spot Trading Platform"
        run: |
          chmod +x bin/*.sh
          mkdir -p ~/.kaggle && echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          mkdir -p logs reports
          ./bin/fetch_data.sh && source ./bin/sentinel.sh && ./bin/notify_discord.sh
      - name: Push Report
        run: cat reports/report_*.md >> $GITHUB_STEP_SUMMARY
