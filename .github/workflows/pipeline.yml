name: Sentinel Auto-Analyzer

on:
  schedule:
    # Runs every night at midnight local time (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:    # This adds a "Run Workflow" button in GitHub

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install kaggle
          sudo apt-get update && sudo apt-get install jq zsh -y

      - name: Execute Pipeline
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATA_SOURCE_NAME: "Iranian E-Commerce Logs"
        run: |
          chmod +x bin/*.sh

          # Create Kaggle config securely in the cloud runner
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          # Create the exact directories that our scripts look for
          mkdir -p $HOME/projects/log-sentinel/logs
          mkdir -p $HOME/projects/log-sentinel/reports
          
          # Run the pipeline
          ./bin/fetch_data.sh
          source ./bin/sentinel.sh
          ./bin/notify_discord.sh
          
      - name: Push Report to GitHub Summary
        run: cat $HOME/projects/log-sentinel/reports/report_*.md >> $GITHUB_STEP_SUMMARY
